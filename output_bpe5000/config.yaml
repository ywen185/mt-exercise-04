name: "transformer_sample_config"
joeynmt_version: "2.0.0"


data:
    train: "C:/Users/Wen Yang/Desktop/mtex04/mt-exercise-04/data/train.bpe5000"
    dev: "C:/Users/Wen Yang/Desktop/mtex04/mt-exercise-04/data/dev.bpe5000"
    test: "C:/Users/Wen Yang/Desktop/mtex04/mt-exercise-04/data/test.bpe5000"
    dataset_type: "plain"
    src:
        
        lang: "en"
        level: "word"
        lowercase: False
        max_sent_length: 100
        # either use a vocabulary limit:
        #voc_limit: 2000
        # or (= not both!) a file with a vocabulary built before starting the training:
        voc_file: "C:/Users/Wen Yang/Desktop/mtex04/mt-exercise-04/data/vocab.bpe_5000"
#        tokenizer_type: "space"
#        tokenizer_cfg:
#            codes: "C:/Users/Wen Yang/Desktop/mtex04/mt-exercise-04/data/bpe_5000.codes"

    trg: 
        lang: "nl"
        level: "word"
        lowercase: False
        max_sent_length: 100
        # either use a vocabulary limit:
        #voc_limit: 2000
        # or (= not both!) a file with a vocabulary built before starting the training:
        voc_file: "C:/Users/Wen Yang/Desktop/mtex04/mt-exercise-04/data/vocab.bpe_5000"
#        tokenizer_type: "space"
#        tokenizer_cfg:
#            codes: "C:/Users/Wen Yang/Desktop/mtex04/mt-exercise-04/data/bpe_5000.codes"

testing:
    beam_size: 5 #10 #2 #1
    beam_alpha: 1.0
    max_output_length: 100
    eval_metrics: ["bleu"]
    sacrebleu_cfg:
        tokenize: "13a"
        lowercase: false

training:
    random_seed: 42
    optimizer: "adam"
    normalization: "tokens"
    learning_rate: 0.0003
    batch_size: 2048
    batch_type: "token"
    eval_batch_size: 1024
    eval_batch_type: "token"
    scheduling: "plateau"
    patience: 8
    weight_decay: 0.0
    decrease_factor: 0.7
    early_stopping_metric: "ppl"
    epochs: 10
    validation_freq: 500
    logging_freq: 100
    eval_metric: "bleu"
    model_dir: "output_bpe5000"
    overwrite: False
    shuffle: True
    use_cuda: True
    max_output_length: 100
    print_valid_sents: [0, 1, 2, 3, 4]
    label_smoothing: 0.3

model:
    initializer: "xavier_uniform"
    bias_initializer: "zeros"
    init_gain: 1.0
    embed_initializer: "xavier_uniform"
    embed_init_gain: 1.0
    tied_embeddings: True
    tied_softmax: True
    encoder:
        type: "transformer"
        num_layers: 4
        num_heads: 2
        embeddings:
            embedding_dim: 256
            scale: True
            dropout: 0
        hidden_size: 256
        ff_size: 512
        dropout: 0
    decoder:
        type: "transformer"
        num_layers: 1
        num_heads: 2
        embeddings:
            embedding_dim: 256
            scale: True
            dropout: 0
        hidden_size: 256
        ff_size: 512
        dropout: 0
